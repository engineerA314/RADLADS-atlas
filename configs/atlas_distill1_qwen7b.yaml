# Atlas Stage 1 Distillation Config (Qwen2.5-7B-Instruct)
#
# Stage 1 = Attention Hidden State Alignment (RADLADS Step 1)
# - Student: Atlas attention replacement (AtlasSelfAttention)
# - Loss: L2 distance between teacher attention outputs and Atlas outputs
#
# Usage:
#   python train.py -c configs/atlas_distill1_qwen7b.yaml --train.data_file data/dclm-10B
#
model:
  __type__: configs.Atlas_Config
  hf_path: Qwen/Qwen2.5-7B-Instruct
  ctx_len: 512
  vocab_size: 151936

  # Atlas attention replacement
  attn_path: atlasattn.AtlasSelfAttention
  attn_classes_path: transformers.models.qwen2.modeling_qwen2.QWEN2_ATTENTION_CLASSES

  # Atlas memory hyperparameters (keep consistent across Stage 1/2/3 for compatibility)
  use_momentum: true
  use_omega_gate: true
  omega_window: 4
  poly_degree: 2
  poly_mode: "elementwise"
  qk_norm: false
  qkv_conv_kernel: null
  use_rope: false
  use_groupnorm: false

train:
  proj_suffix: atlas-stage1
  train_stage: 2
  load_model: "" # Start from scratch (HF model will be loaded)
  load_partial: 1

  data_type: "binidx"
  data_file: "data/dclm-10B"
  my_exit_tokens: 100000000
  magic_prime: 2929793 # For ctx_len=512 (overridden by scripts/run_stage1.sh)

  optimizer: adamw
  lr_decay_type: cos
  lr_init: 1e-3
  lr_final: 1e-5
  warmup_steps: 50
  beta1: 0.9
  beta2: 0.95
  adam_eps: 1e-8
  weight_decay: 0

  devices: 1
  num_nodes: 1
  micro_bsz: 1
  accumulate_grad_batches: 1
  strategy: auto
  grad_cp: 0

  # Stage 1 = Attention Alignment
  attention_distillation_stage: 1
